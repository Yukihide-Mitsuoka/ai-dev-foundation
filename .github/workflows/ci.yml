# CI — Layer 3 (authoritative) quality gate. Calls only canonical `make` targets
# (CLAUDE.md §11) so this file never changes when the stack changes.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # TEMPLATE: add your runtime setup action here (setup-node / setup-python / setup-go)
      - run: make setup
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make setup
      - run: make coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make setup
      - run: make build

  doctor:
    # Foundation self-check: metadata invariants (YAML frontmatter intact, no collapsed
    # frontmatter) + guard-hook block/allow tests. Catches the doc/rule regressions that
    # the no-op template Makefile can't. Dependency-free (pure bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make doctor

  link-check:
    # Broken relative links in docs are a real defect (docs are the product here).
    # Offline mode: verify local file links resolve; external URLs are not fetched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check links (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --no-progress ."
          fail: true

  pr-quality:
    # PR hygiene: Conventional Commit title (WF-030) + size guard (GR-020)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: PR size guard (GR-020)
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > "${RUNNER_TEMP}/pr-files.json"
          python3 scripts/pr_size_policy.py --files-json "${RUNNER_TEMP}/pr-files.json" --additions "${ADDITIONS}" --deletions "${DELETIONS}" --files "${FILES}"
      - name: Check out accepted role contract (ADR-0021)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pr-language-base
          persist-credentials: false
      - name: Resolve accepted repository role
        id: pr-role
        working-directory: .pr-language-base
        run: |
          python3 -c 'import os; from pathlib import Path; from scripts.pr_repository_role import resolve_role; print("role=" + resolve_role(Path("."), os.environ["GITHUB_REPOSITORY"]))' >> "$GITHUB_OUTPUT"
      - name: Validate PR prose language (ADR-0020/0021)
        env:
          PR_ROLE: ${{ steps.pr-role.outputs.role }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -m scripts.pr_language_policy
